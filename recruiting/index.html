<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiting | Wake Up and Produce</title>
  <meta name="description" content="Recruiting tools and resources for Mountain View HS Girls Basketball — coming soon.">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; background: var(--site-bg); color: var(--site-text); font-family: var(--site-font); min-height: 100vh; display: flex; flex-direction: column; }
    .rec-page { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 56px; flex: 1; }
    .rec-hero { margin-bottom: 28px; }
    .eyebrow { color: var(--site-accent-strong); font-size: .74rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    .rec-hero h1 { max-width: 900px; margin: 10px 0; font-size: 1.875rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
    .byline { margin: 0 0 0; color: var(--site-muted); font-size: 0.875rem; font-weight: 500; }
    .coming-soon-card { border: 1px solid var(--site-border); border-radius: 12px; background: rgba(255,255,255,.86); box-shadow: 0 1px 2px rgba(28,25,23,.04); padding: clamp(32px, 6vw, 52px); max-width: 560px; margin-top: 32px; }
    .coming-soon-card .label { color: var(--site-accent-strong); font-size: .74rem; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; margin: 0 0 10px; }
    .coming-soon-card p { color: var(--site-muted); font-size: 1.05rem; line-height: 1.65; margin: 0; }
  </style>
</head>
<body>
  <div data-shared-nav></div>
  <main class="rec-page">
    <header class="rec-hero">
      <p class="eyebrow">Recruiting</p>
      <h1>Recruiting</h1>
      <p class="byline">By Baxter · Mountain View HS Girls Basketball</p>
    </header>
    <div class="coming-soon-card">
      <p class="label">Coming soon</p>
      <p>Recruiting tools and resources are in the works — check back soon.</p>
    </div>
  </main>
  <div data-shared-footer></div>
  <script src="../shared-nav.js"></script>

</body>
</html>
