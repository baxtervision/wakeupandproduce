            const el = document.getElementById('g' + id);

        }
        function setGbbBall(xy) {

            if (el) { el.style.left = xy[0] + '%'; el.style.top = xy[1] + '%'; }
        }
        function drawGbbRoutes(routes, limit = routes.length) {
            const group = document.getElementById('gbb-routes');
            group.innerHTML = '';
            const visible = routes.slice(0, limit);
            visible.forEach(([x1,y1,x2,y2,type], index) => {
                const sx1 = x1 * 4, sy1 = y1 * 3, sx2 = x2 * 4, sy2 = y2 * 3;
                const colors = { pass:'#f59e0b', drive:'#f97316', dribble:'#f97316', screen:'#1c1917', trap:'#2563eb', chase:'#ef4444', switch:'#16a34a' };
                const movementTypes = ['cut','move','fill','rotate','shift','sprint','crash','shot','close','match'];
                const color = colors[type] || '#64748b';
                const isMovement = movementTypes.includes(type);
                const isDrive = type === 'drive' || type === 'dribble';
                const dx = sx2 - sx1, dy = sy2 - sy1;
                const length = Math.sqrt(dx * dx + dy * dy) || 1;
                const ux = dx / length, uy = dy / length;
                const nx = -uy, ny = ux;
                if (isDrive) {
                    let d = 'M ' + sx1 + ' ' + sy1;
                    const steps = 18;
                    for (let i = 1; i <= steps; i++) {
                        const t = i / steps;
                        const wave = Math.sin(t * Math.PI * 6) * 5;
                        d += ' L ' + (sx1 + dx * t + nx * wave).toFixed(1) + ' ' + (sy1 + dy * t + ny * wave).toFixed(1);
                    }
                    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
                    path.setAttribute('d', d);
                    path.setAttribute('stroke', color);
                    path.setAttribute('fill', 'none');
                    group.appendChild(path);
                } else {
                    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
                    line.setAttribute('x1', sx1); line.setAttribute('y1', sy1);
                    line.setAttribute('x2', sx2); line.setAttribute('y2', sy2);
                    line.setAttribute('stroke', color);
                    if (type === 'pass' || isMovement || type === 'trap' || type === 'chase') line.setAttribute('stroke-dasharray', '7 5');
                    group.appendChild(line);
                    if (type === 'screen') {
                        const tbar = document.createElementNS('http://www.w3.org/2000/svg','line');
                        tbar.setAttribute('x1', sx2 - nx * 9); tbar.setAttribute('y1', sy2 - ny * 9);
                        tbar.setAttribute('x2', sx2 + nx * 9); tbar.setAttribute('y2', sy2 + ny * 9);
                        tbar.setAttribute('stroke', color);
                        group.appendChild(tbar);
                    }
                }
                if (type !== 'screen') {
                    const arrow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
                    arrow.setAttribute('points', [
                        [sx2, sy2],
                        [sx2 - ux * 12 + nx * 5, sy2 - uy * 12 + ny * 5],
                        [sx2 - ux * 12 - nx * 5, sy2 - uy * 12 - ny * 5]
                    ].map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
                    arrow.setAttribute('fill', color);
                    group.appendChild(arrow);
                }
                const label = document.createElementNS('http://www.w3.org/2000/svg','text');
                label.setAttribute('x', (sx1 + sx2) / 2);
                label.setAttribute('y', (sy1 + sy2) / 2 - 6);
                label.setAttribute('fill', color);
                label.setAttribute('text-anchor', 'middle');
                label.setAttribute('class', 'route-step-label');
                label.textContent = index + 1;
                group.appendChild(label);
            });
        }
        function renderGbbFrame(frame, routeLimit = frame.routes ? frame.routes.length : 0) {
            players.forEach(id => setGbbPlayer(id, frame.positions[id]));
            setGbbBall(frame.ball);
            drawGbbRoutes(frame.routes || [], routeLimit);
        }
        function gbbLerp(a, b, t) { return a + (b - a) * t; }
        function gbbEase(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }
        function interpolateGbbFrame(from, to, amount) {
            const positions = {};
            players.forEach(id => {
                positions[id] = [
                    gbbLerp(from.positions[id][0], to.positions[id][0], amount),
                    gbbLerp(from.positions[id][1], to.positions[id][1], amount)
                ];
            });
            return {
                positions,
                ball: [gbbLerp(from.ball[0], to.ball[0], amount), gbbLerp(from.ball[1], to.ball[1], amount)],
                routes: to.routes || []
            };
        }
        function animateGbbFrames(frames, index = 0) {
            if (index >= frames.length - 1) { gbbAnimationFrame = null; renderGbbFrame(frames[frames.length - 1]); return; }
            const from = frames[index], to = frames[index + 1], duration = 950, start = performance.now();
            function step(now) {
                const t = Math.min((now - start) / duration, 1);
                renderGbbFrame(interpolateGbbFrame(from, to, gbbEase(t)));
                if (t < 1) gbbAnimationFrame = requestAnimationFrame(step);
                else animateGbbFrames(frames, index + 1);
            }
            gbbAnimationFrame = requestAnimationFrame(step);
        }
        function clearGbbTimers() { gbbTimers.forEach(clearTimeout); gbbTimers = []; if (gbbAnimationFrame) { cancelAnimationFrame(gbbAnimationFrame); gbbAnimationFrame = null; } }

        function selectAction(data) {
            clearGbbTimers();
            gbbAction = data;
            document.getElementById('gbb-action-title').textContent = data.title;
            document.getElementById('gbb-action-tag').textContent = data.tag;
            document.getElementById('gbb-action-desc').textContent = data.desc;
            document.getElementById('gbb-read-handler').textContent = data.reads.handler;
            document.getElementById('gbb-read-screener').textContent = data.reads.screener;
            document.getElementById('gbb-counters').textContent = data.counters;
            const exSec = document.getElementById('gbb-examples-section');
            const exEl = document.getElementById('gbb-examples');
            exEl.innerHTML = data.examples.map(ex => `<div class="p-4 bg-stone-50 rounded-lg border border-stone-100"><span class="text-xs font-bold uppercase tracking-wider text-orange-600 block mb-1">${ex.team}</span><p class="text-sm text-stone-700">${ex.text}</p></div>`).join('');
            exSec.classList.remove('hidden');
            document.querySelectorAll('.gbb-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.id === data.id));
            renderGbbFrame(data.frames[0], 0);
            if (history.pushState) history.pushState(null,'','#'+data.id);
        }

        function showGbbSequence() {
            if (!gbbAction) return;
            clearGbbTimers();
            const frames = gbbAction.frames;
            renderGbbFrame(frames[0], 0);
            const routes = frames.slice(1).flatMap(frame => frame.routes || []);
            routes.forEach((_, index) => gbbTimers.push(setTimeout(() => drawGbbRoutes(routes, index + 1), 320 * (index + 1))));
        }
        function playGbbSequence() {
            if (!gbbAction) return;
            clearGbbTimers();
            const frames = gbbAction.frames;
            renderGbbFrame(frames[0], 0);
            gbbTimers.push(setTimeout(() => animateGbbFrames(frames), 650));
        }

        function initGbb() {
            const list = document.getElementById('gbb-action-list');
            list.innerHTML = playbookData.map((play, i) => `<button class="gbb-btn action-choice" data-id="${play.id}"><strong>${i+1}. ${play.title}</strong><span>${play.tag}</span></button>`).join('');
            document.querySelectorAll('.gbb-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const data = playbookData.find(p => p.id === btn.dataset.id);
                    if (data) selectAction(data);
                });
            });
            document.getElementById('gbb-show').addEventListener('click', showGbbSequence);
            document.getElementById('gbb-play').addEventListener('click', playGbbSequence);
            document.getElementById('gbb-reset').addEventListener('click', () => { if (gbbAction) { clearGbbTimers(); renderGbbFrame(gbbAction.frames[0], 0); } });
            const hash = location.hash.replace('#','');
            const initial = playbookData.find(p => p.id === hash) || playbookData[0];
            selectAction(initial);
        }

        window.addEventListener('load', initGbb);
    </script>
    <div data-shared-footer></div>
    
<script src="../shared-nav.js"></script>
